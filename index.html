<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExpenseFlow — Personal Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-top">
        <h1>💸 ExpenseFlow</h1>
        <div class="header-controls">
          <!-- Currency Selector -->
          <select id="currencySelect" class="currency-select" title="Select currency">
            <option value="USD">🇺🇸 USD ($)</option>
            <option value="EUR">🇪🇺 EUR (€)</option>
            <option value="GBP">🇬🇧 GBP (£)</option>
            <option value="ETB">🇪🇹 ETB (Br)</option>
            <option value="JPY">🇯🇵 JPY (¥)</option>
            <option value="INR">🇮🇳 INR (₹)</option>
            <option value="CNY">🇨🇳 CNY (¥)</option>
            <option value="NGN">🇳🇬 NGN (₦)</option>
            <option value="KES">🇰🇪 KES (KSh)</option>
            <option value="BRL">🇧🇷 BRL (R$)</option>
            <option value="CAD">🇨🇦 CAD (C$)</option>
            <option value="AUD">🇦🇺 AUD (A$)</option>
            <option value="ZAR">🇿🇦 ZAR (R)</option>
            <option value="EGP">🇪🇬 EGP (£E)</option>
            <option value="GHS">🇬🇭 GHS (₵)</option>
            <option value="UGX">🇺🇬 UGX (USh)</option>
            <option value="TZS">🇹🇿 TZS (TSh)</option>
            <option value="RWF">🇷🇼 RWF (FRw)</option>
            <option value="AED">🇦🇪 AED (د.إ)</option>
            <option value="SAR">🇸🇦 SAR (﷼)</option>
          </select>
          <!-- Theme Toggle -->
          <button id="themeToggle" class="theme-toggle" title="Toggle dark/light mode">
            <span id="themeIcon">🌙</span>
          </button>
        </div>
      </div>
      <p class="tagline">Track your spending. Own your budget.</p>
    </header>

    <!-- Summary Cards -->
    <section class="cards">
      <div class="card">
        <span class="card-label">Total Spent</span>
        <span class="card-value" id="totalSpent">$0.00</span>
      </div>
      <div class="card">
        <span class="card-label">Entries</span>
        <span class="card-value" id="entryCount">0</span>
      </div>
      <div class="card">
        <span class="card-label">This Month</span>
        <span class="card-value" id="monthSpent">$0.00</span>
      </div>
    </section>

    <!-- Add Expense Form -->
    <section class="form-section">
      <h2>Add Expense</h2>
      <form id="expenseForm" class="expense-form">
        <input type="text" id="description" placeholder="Description (e.g. Coffee at Starbucks)" required />
        <input type="number" id="amount" placeholder="Amount" step="0.01" min="0.01" required />
        <select id="category" required>
          <option value="">Category</option>
          <optgroup label="🍔 Food & Drinks">
            <option value="Food">🍔 Food</option>
            <option value="Groceries">🛒 Groceries</option>
            <option value="Restaurants">🍽️ Restaurants</option>
            <option value="Coffee">☕ Coffee</option>
            <option value="Drinks">🍺 Drinks & Nightlife</option>
            <option value="Snacks">🍫 Snacks</option>
          </optgroup>
          <optgroup label="🚗 Transport">
            <option value="Transport">🚗 General Transport</option>
            <option value="Fuel">⛽ Fuel</option>
            <option value="Public Transport">🚌 Public Transport</option>
            <option value="Taxi/Ride">🚕 Taxi / Ride Share</option>
            <option value="Parking">🅿️ Parking</option>
            <option value="Vehicle Maintenance">🔧 Vehicle Maintenance</option>
          </optgroup>
          <optgroup label="🛍️ Shopping">
            <option value="Shopping">🛍️ General Shopping</option>
            <option value="Clothing">👕 Clothing</option>
            <option value="Electronics">📱 Electronics</option>
            <option value="Home">🏠 Home & Furniture</option>
            <option value="Gifts">🎁 Gifts</option>
          </optgroup>
          <optgroup label="📄 Bills & Utilities">
            <option value="Bills">📄 General Bills</option>
            <option value="Rent">🏠 Rent</option>
            <option value="Electricity">⚡ Electricity</option>
            <option value="Water">💧 Water</option>
            <option value="Internet">🌐 Internet</option>
            <option value="Phone">📱 Phone Bill</option>
            <option value="Insurance">🛡️ Insurance</option>
            <option value="Subscriptions">🔁 Subscriptions</option>
          </optgroup>
          <optgroup label="🎬 Entertainment">
            <option value="Entertainment">🎬 General Entertainment</option>
            <option value="Movies">🎥 Movies</option>
            <option value="Music">🎵 Music</option>
            <option value="Games">🎮 Games</option>
            <option value="Sports">⚽ Sports</option>
            <option value="Travel">✈️ Travel</option>
            <option value="Hobbies">🎨 Hobbies</option>
          </optgroup>
          <optgroup label="🏥 Health">
            <option value="Health">🏥 General Health</option>
            <option value="Medicine">💊 Medicine</option>
            <option value="Doctor">👨‍⚕️ Doctor Visit</option>
            <option value="Dental">🦷 Dental</option>
            <option value="Gym">💪 Gym & Fitness</option>
            <option value="Mental Health">🧠 Mental Health</option>
          </optgroup>
          <optgroup label="🎓 Education">
            <option value="Education">🎓 General Education</option>
            <option value="Tuition">🏫 Tuition</option>
            <option value="Books">📚 Books</option>
            <option value="Courses">💻 Online Courses</option>
          </optgroup>
          <optgroup label="👨‍👩‍👧 Personal">
            <option value="Personal Care">💄 Personal Care</option>
            <option value="Haircut">✂️ Haircut & Salon</option>
            <option value="Kids">🧒 Kids & Family</option>
            <option value="Pets">🐾 Pets</option>
            <option value="Charity">❤️ Charity & Donations</option>
          </optgroup>
          <optgroup label="📦 Other">
            <option value="Other">📦 Other</option>
            <option value="Business">💼 Business Expense</option>
            <option value="Fees">🏦 Bank Fees</option>
            <option value="Taxes">🏛️ Taxes</option>
          </optgroup>
        </select>
        <button type="submit" class="btn-add">Add</button>
      </form>
    </section>

    <!-- Chart + List -->
    <div class="main-grid">
      <section class="chart-section">
        <h2>Spending by Category</h2>
        <div class="chart-wrap">
          <canvas id="categoryChart"></canvas>
        </div>
      </section>

      <section class="list-section">
        <div class="list-header">
          <h2>Recent Expenses</h2>
          <button id="downloadPdf" class="btn-pdf" title="Download expenses as PDF">
            📄 Download PDF
          </button>
        </div>
        <ul id="expenseList" class="expense-list">
          <li class="empty-state">No expenses yet. Add one above! 👆</li>
        </ul>
      </section>
    </div>

    <footer class="footer">
      <p>Made with 💙 — <a href="https://github.com/luelzelalem848-max/expenseflow" target="_blank">View on GitHub</a></p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
